<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóndor de Guanentá</title>
    <link rel="stylesheet" href="style.css">

<style>
.back-games-guanentino {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 999999;
    display: inline-block;
    padding: 10px 16px;
    background: #111;
    color: #fff !important;
    border: 2px solid #00ff88;
    border-radius: 999px;
    text-decoration: none !important;
    font: 700 14px Arial, sans-serif;
    box-shadow: 0 0 15px rgba(0,255,136,.25);
    transition: .2s ease;
}
.back-games-guanentino:hover {
    background: #00ff88;
    color: #000 !important;
    transform: scale(1.04);
}
</style>

</head>
<body>
<a class="back-games-guanentino" href="../index.html">← Games Guanentino</a>

<h1>Cóndor de Guanentá</h1>

<div id="contenedor">
    <canvas id="juego" width="400" height="600"></canvas>

    <div id="gameOver" class="oculto">
        <h2>¡El Cóndor cayó!</h2>
        <p>Puntos: <span id="puntajeFinal">0</span></p>
        <button onclick="reiniciarJuego()">Jugar otra vez</button>
    </div>
</div>

<p>Presiona ESPACIO para volar.</p>

<script src="script.js"></script>

</body>
</html>
