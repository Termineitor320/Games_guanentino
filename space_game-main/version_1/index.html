<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Rocket Defense</title>
    <link rel="stylesheet" href="style.css">

<style>
.back-games-guanentino {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 999999;
    display: inline-block;
    padding: 10px 16px;
    background: #111;
    color: #fff !important;
    border: 2px solid #00ff88;
    border-radius: 999px;
    text-decoration: none !important;
    font: 700 14px Arial, sans-serif;
    box-shadow: 0 0 15px rgba(0,255,136,.25);
    transition: .2s ease;
}
.back-games-guanentino:hover {
    background: #00ff88;
    color: #000 !important;
    transform: scale(1.04);
}
</style>

</head>
<body>
<a class="back-games-guanentino" href="../../index.html">← Games Guanentino</a>
    <div class="game-container">
        <div class="start-screen" id="startScreen">
            <h1>🚀 SPACE INVADERS</h1>
            <h2>ROCKET DEFENSE</h2>
            <div class="instructions">
                <p>← → Arrow keys to move</p>
                <p>SPACEBAR to shoot</p>
                <p>Defend Earth from alien invasion!</p>
            </div>
            <button id="startButton">START MISSION</button>
        </div>
        
        <div class="game-ui" id="gameUI" style="display: none;">
            <div class="hud">
                <div class="hud-item">
                    <span class="label">SCORE</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">LEVEL</span>
                    <span id="level" class="value">1</span>
                </div>
                <div class="hud-item">
                    <span class="label">LIVES</span>
                    <span id="lives" class="value">❤️❤️❤️</span>
                </div>
            </div>
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>
        
        <div class="game-over-screen" id="gameOverScreen" style="display: none;">
            <h1>MISSION STATUS</h1>
            <div id="finalMessage"></div>
            <div class="final-score">
                <span>FINAL SCORE: </span>
                <span id="finalScore">0</span>
            </div>
            <button id="restartButton">RESTART MISSION</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
