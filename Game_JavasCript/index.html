
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geometry Dash | Game Select</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 15% 20%, #ff3d81 0%, transparent 20%),
                radial-gradient(circle at 85% 80%, #7b35ff 0%, transparent 22%),
                linear-gradient(135deg, #090012, #13001f 45%, #050008);

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Luces decorativas */

        body::before,
        body::after {
            content: "";
            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: .25;

            animation: float 8s ease-in-out infinite alternate;

            pointer-events: none;
        }

        body::before {
            background: #ff167f;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #713cff;
            bottom: -100px;
            right: -100px;

            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(80px, 50px);
            }
        }

        /* CONTENEDOR */

        .container {
            width: min(1000px, 92%);

            text-align: center;

            position: relative;
            z-index: 2;
        }

        /* TITULO */

        .small-title {
            color: #ff4d9d;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 5px;

            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(45px, 8vw, 85px);

            font-weight: 900;

            letter-spacing: 5px;

            text-transform: uppercase;

            color: white;

            text-shadow:
                4px 4px 0 #ff2384,
                8px 8px 0 #5b21ff;
        }

        .subtitle {
            color: #bcb3c9;

            margin-top: 12px;

            margin-bottom: 45px;

            font-size: 17px;
        }

        /* JUEGOS */

        .games {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 25px;
        }

        .game {
            position: relative;

            padding: 35px 25px;

            min-height: 310px;

            border-radius: 25px;

            background: rgba(15, 8, 25, .88);

            border: 2px solid rgba(255,255,255,.12);

            box-shadow:
                0 20px 50px rgba(0,0,0,.5);

            overflow: hidden;

            transition: .3s ease;
        }

        .game::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            filter: blur(60px);

            opacity: .2;

            top: -90px;
            right: -70px;
        }

        .classic::before {
            background: #ff286f;
        }

        .enhanced::before {
            background: #743cff;
        }

        .game:hover {
            transform: translateY(-10px) scale(1.02);

            border-color: #ff4d9d;

            box-shadow:
                0 25px 60px rgba(0,0,0,.6),
                0 0 30px rgba(255,77,157,.2);
        }

        /* ICONO */

        .icon {
            font-size: 65px;

            margin-bottom: 18px;

            position: relative;
        }

        /* TITULOS DE VERSION */

        .game h2 {
            font-size: 26px;

            margin-bottom: 12px;

            position: relative;
        }

        .classic h2 {
            color: #ff4d9d;
        }

        .enhanced h2 {
            color: #9d7cff;
        }

        .game p {
            color: #aaa2b3;

            font-size: 15px;

            line-height: 1.6;

            min-height: 50px;

            position: relative;
        }

        /* BOTON PLAY */

        .play {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-top: 25px;

            padding: 14px 32px;

            min-width: 190px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 17px;

            font-weight: 900;

            letter-spacing: 2px;

            color: white;

            position: relative;

            overflow: hidden;

            transition: .25s ease;
        }

        .play::after {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background: rgba(255,255,255,.25);

            transform: skewX(-25deg);

            transition: .5s;
        }

        .play:hover::after {
            left: 130%;
        }

        .play:hover {
            transform: scale(1.07);

            color: white;
        }

        .classic .play {
            background:
                linear-gradient(
                    135deg,
                    #ff167f,
                    #ff4d4d
                );

            box-shadow:
                0 8px 25px rgba(255,22,127,.35);
        }

        .enhanced .play {
            background:
                linear-gradient(
                    135deg,
                    #673cff,
                    #a855f7
                );

            box-shadow:
                0 8px 25px rgba(103,60,255,.35);
        }

        /* FOOTER */

        footer {
            margin-top: 35px;

            color: #655b70;

            font-size: 12px;

            letter-spacing: 1px;
        }

        /* BOTON REGRESAR */

        .back-games-guanentino {
            position: fixed;

            top: 18px;
            left: 18px;

            z-index: 20;

            padding: 10px 17px;

            border-radius: 10px;

            background: rgba(10,5,15,.85);

            border: 1px solid #ff4d9d;

            color: #fff;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;

            transition: .25s ease;

            backdrop-filter: blur(10px);
        }

        .back-games-guanentino:hover {
            background: #ff4d9d;

            color: #10000b;

            transform: translateY(-2px);
        }

        /* RESPONSIVE */

        @media (max-width: 700px) {

            body {
                overflow-y: auto;
                padding: 70px 0 30px;
            }

            .games {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 48px;
            }

            .game {
                min-height: auto;
            }
        }
    </style>
</head>

<body>

    <!-- REGRESAR AL MENU -->
    <a
        class="back-games-guanentino"
        href="../index.html">
        ← Games Guanentino
    </a>


    <main class="container">

        <div class="small-title">
            GAME SELECT
        </div>

        <h1>
            GEOMETRY DASH
        </h1>

        <p class="subtitle">
            Choose your version and start playing
        </p>


        <section class="games">

            <!-- VERSION CLASICA -->

            <article class="game classic">

                <div class="icon">
                    🟪
                </div>

                <h2>
                    CLASSIC
                </h2>

                <p>
                    La versión original del juego.
                    Sencilla, rápida y directa.
                </p>

                <a
                    class="play"
                    href="index-classic.html">

                    ▶ PLAY

                </a>

            </article>


            <!-- VERSION ENHANCED -->

            <article class="game enhanced">

                <div class="icon">
                    ⚡
                </div>

                <h2>
                    ENHANCED
                </h2>

                <p>
                    Una versión mejorada con nuevas
                    funciones y características.
                </p>

                <a
                    class="play"
                    href="index-enhanced.html">

                    ▶ PLAY

                </a>

            </article>

        </section>


        <footer>
            GAME JAVASCRIPT · GEOMETRY DASH
        </footer>

    </main>

</body>

</html>
