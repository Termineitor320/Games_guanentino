<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frogger Simplificado</title>
  <link rel="stylesheet" href="style.css">

<style>
.back-games-guanentino {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 999999;
    display: inline-block;
    padding: 10px 16px;
    background: #111;
    color: #fff !important;
    border: 2px solid #00ff88;
    border-radius: 999px;
    text-decoration: none !important;
    font: 700 14px Arial, sans-serif;
    box-shadow: 0 0 15px rgba(0,255,136,.25);
    transition: .2s ease;
}
.back-games-guanentino:hover {
    background: #00ff88;
    color: #000 !important;
    transform: scale(1.04);
}
</style>

</head>
<body>
<a class="back-games-guanentino" href="../../index.html">← Games Guanentino</a>

  <h1>Frogger</h1>
  
  <div id="hud">
    Vidas: <span id="lives">3</span> | Puntos: <span id="score">0</span>
  </div>

  <canvas id="game" width="400" height="400"></canvas>

  <div class="controls">
    <div><button onclick="move('up')">▲</button></div>
    <div>
      <button onclick="move('left')">◀</button>
      <button onclick="move('down')">▼</button>
      <button onclick="move('right')">▶</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
